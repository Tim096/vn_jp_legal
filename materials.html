<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f5f0e6">
  <link rel="stylesheet" href="./style.css">
  <title>公式教材 2026年度</title>
</head>
<body>
  <header class="site-header">
    <div><p class="eyebrow">STUDY LIBRARY</p><h1>公式教材 <span>2026年度</span></h1></div>
    <a class="admin-entry-link" href="./index.html">題庫へ戻る</a>
  </header>
  <main class="materials-main">
    <p id="materialsStatus" role="status">教材一覧を読み込んでいます。</p>
    <section class="material-reader" aria-labelledby="readerTitle" hidden>
      <h2 id="readerTitle"></h2>
      <p class="material-links"><a id="openPdf" target="_blank" rel="noopener">PDFを開く</a> <a id="downloadPdf" download>原本をダウンロード</a></p>
      <p class="material-hint">オフラインで読むには、原本を端末へダウンロードしてください。</p>
      <div class="pdf-controls" aria-label="PDF のページ操作">
        <button id="pdfPrevious" type="button" disabled>前のページ</button>
        <label>ページ <input id="pdfPage" type="number" min="1" value="1" disabled></label>
        <span id="pdfPageCount"></span>
        <button id="pdfNext" type="button" disabled>次のページ</button>
        <label>拡大 <select id="pdfZoom"><option value="1">幅に合わせる</option><option value="1.5">150%</option><option value="2">200%</option></select></label>
      </div>
      <p id="pdfStatus" role="status"></p>
      <div id="pdfReader" class="pdf-viewport" aria-label="教材 PDF"></div>
      <details class="pdf-text"><summary>このページのテキスト</summary><pre id="pdfPageText"></pre></details>
    </section>
    <h2>２級公式通信講座テキスト</h2>
    <ol id="textbookList" class="material-list"></ol>
    <h2>IBT・CBT対策模擬問題４</h2>
    <ol id="mockPdfList" class="material-list"></ol>
  </main>
  <script src="./materials.js" type="module"></script>
</body>
</html>
